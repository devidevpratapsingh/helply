services:
  postgres:
    image: postgres:17
    container_name: helpingai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpingai

    ports:
      - "5432:5432"

    volumes:
      - helpingai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpingai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helpingai_postgres_data: